[project]
name = "news-curator"
version = "0.1.0"
description = "Curadoria de notícias com agentes de IA (Agno + Groq): pesquisa, apuração, verificação factual e redação."
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "agno==2.4.8",
    "ddgs==9.10.0",
    "duckduckgo-search==8.1.1",
    "groq>=1.7.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]
